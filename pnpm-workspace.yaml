# These postinstall scripts were never approved under pnpm 10 either, so they
# stay disabled to keep install behaviour identical.
allowBuilds:
  esbuild: false
  spawn-sync: false
  vue-demi: false

overrides:
  # adm-zip and shell-quote come in via web-ext; esbuild via vite.
  # vite itself is a peer everywhere, so overrides don't reach it — it is
  # declared explicitly in devDependencies instead (pinned to 7.x for wxt).
  adm-zip: '>=0.6.0'
  brace-expansion: '>=5.0.5'
  esbuild: '>=0.28.1'
  flatted: '>=3.4.2'
  minimatch: '>=10.2.3'
  node-forge: '>=1.4.0'
  'picomatch@<2.3.2': '>=2.3.2'
  'picomatch@>=4 <4.0.4': '>=4.0.4'
  rollup@4.58.0: 4.59.0
  shell-quote: '>=1.9.0'

patchedDependencies:
  multimatch@6.0.0: patches/multimatch@6.0.0.patch
